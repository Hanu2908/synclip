<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop tray popover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 380px; height: 560px; box-sizing: border-box; background: #1A120E; color: #F1DFD8; font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 12px 10px 16px;">
    <div style="width: 26px; height: 26px; border-radius: 8px; background: #FF7A1A; color: #2E0E00; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></div>
    <span style="font-size: 17px; font-weight: 750; font-stretch: 120%; flex-grow: 1;">Synclip</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #5D4033; color: #FFDBCC; font-size: 12px; font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 4px; background: #FFB693;"></span>Live</span>
  </div>

  <button style="display: flex; align-items: center; gap: 10px; margin: 0 12px; height: 44px; padding: 0 12px; border-radius: 12px; border: none; background: #271E1A; color: #F1DFD8; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span style="flex-grow: 1; text-align: left;">My Devices · 3 online</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; flex-grow: 1;">
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 10px; border-radius: 14px; background: #322824; box-shadow: inset 3px 0 0 #2E6FC4;">
      <div style="font-size: 14px; font-weight: 600; line-height: 1.4;">Meeting moved to 5 pm, room 204. Bring the printed draft.</div>
      <div style="font-size: 11px; color: #DDC1B6;">MacBook · just now · on your clipboard</div>
    </div>
    <sc-for list="{{clips}}" as="k" hint-placeholder-count="4">
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 9px 12px; border-radius: 12px; border: none; background: #231A16; color: #F1DFD8; font-family: inherit; text-align: left; cursor: pointer;">
        <span style="font-family: {{k.font}}; font-size: 13px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{k.text}}</span>
        <span style="font-size: 11px; color: #DDC1B6;">{{k.meta}}</span>
      </button>
    </sc-for>
    <div style="font-size: 11px; color: #A58B81; padding: 2px 4px;">Click a clip to copy it.</div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px 12px 16px; border-top: 1px solid #3D332E;">
    <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; flex-grow: 1;"><span style="position: relative; width: 40px; height: 24px; border-radius: 12px; background: #FFB693; flex-shrink: 0;"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: #561F00;"></span></span>Watch clipboard</label>
    <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #A58B81; background: transparent; color: #FFB693; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Open Synclip</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const sans = "'Roboto Flex', system-ui, sans-serif", mono = "'JetBrains Mono', monospace";
    return {
      clips: [
        { text: 'https://pub.dev/packages/cryptography', meta: 'Galaxy · 12 min', font: sans },
        { text: 'flutter pub add supabase_flutter', meta: 'This PC · 1 h', font: mono },
        { text: 'Order #4471 ships Thursday via BlueDart', meta: 'Galaxy · 2 h', font: sans },
        { text: 'Room 204, second floor, left of the lift', meta: 'MacBook · 3 h', font: sans }
      ]
    };
  }
}
</script>
</body>
</html>
