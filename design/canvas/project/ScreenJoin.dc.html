<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join, waiting for approval</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F6; color: #231A16; font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 8px 8px 0 4px; box-sizing: border-box;">
    <button aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: transparent; color: #231A16; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <span style="font-size: 22px; font-weight: 750; font-stretch: 120%;">Join a room</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #DDC1B6; margin: 0 16px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px; color: #A43D00; font-size: 14px; font-weight: 600;">Code<span style="width: 48px; height: 3px; border-radius: 3px 3px 0 0; background: #A43D00;"></span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px; color: #56423A; font-size: 14px; font-weight: 550;">Scan QR<span style="height: 3px;"></span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 24px 16px;">
    <div style="display: flex; justify-content: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 600;">
      <div style="width: 46px; height: 58px; border-radius: 12px; background: #FCEAE3; display: flex; align-items: center; justify-content: center;">K</div>
      <div style="width: 46px; height: 58px; border-radius: 12px; background: #FCEAE3; display: flex; align-items: center; justify-content: center;">7</div>
      <div style="width: 46px; height: 58px; border-radius: 12px; background: #FCEAE3; display: flex; align-items: center; justify-content: center; margin-right: 10px;">P</div>
      <div style="width: 46px; height: 58px; border-radius: 12px; background: #FCEAE3; display: flex; align-items: center; justify-content: center;">Q</div>
      <div style="width: 46px; height: 58px; border-radius: 12px; background: #FCEAE3; display: flex; align-items: center; justify-content: center;">2</div>
      <div style="width: 46px; height: 58px; border-radius: 12px; background: #FCEAE3; display: flex; align-items: center; justify-content: center;">X</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 22px; border-radius: 28px; background: #FFFFFF; border: 1px solid #DDC1B6;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 20px; background: #2E6FC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"/><path d="M2 20h20"/></svg></div>
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 20px; font-weight: 600;">Approve on MacBook</span><span style="font-size: 13px; color: #56423A;">MacBook is reviewing your request</span></div>
      </div>
      <div style="font-size: 14px; line-height: 1.5; color: #56423A;">Make sure MacBook shows the same five pictures, in the same order.</div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; text-align: center; padding: 16px 6px; border-radius: 20px; background: #FFF1EC;">
        <sc-for list="{{sas}}" as="e" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 32px; line-height: 1;">{{e.glyph}}</span><span style="font-size: 11px; font-weight: 600; color: #56423A;">{{e.name}}</span></div>
        </sc-for>
      </div>
      <div style="height: 4px; border-radius: 2px; background: #FFDBCC; overflow: hidden;"><div style="width: 35%; height: 4px; background: #A43D00;"></div></div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #56423A;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>The pictures prove no one in the middle swapped keys. Scanning a QR skips this step.</span></div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 16px 28px;">
    <button style="width: 100%; height: 48px; border-radius: 24px; border: 1px solid #8A7269; background: transparent; color: #A43D00; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Cancel request</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { sas: [{ glyph: '🦊', name: 'Fox' }, { glyph: '🍋', name: 'Lemon' }, { glyph: '🚀', name: 'Rocket' }, { glyph: '🎸', name: 'Guitar' }, { glyph: '🌵', name: 'Cactus' }] };
  }
}
</script>
</body>
</html>
