<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approval sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Roboto Flex', system-ui, sans-serif; color: #231A16;">
  <dc-import name="ScreenHome" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; inset: 0; background: #231A1666;"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 18px; padding: 12px 24px 28px; border-radius: 28px 28px 0 0; background: #FCEAE3;">
    <div style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #8A7269;"></div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #C23B52; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 22px; font-weight: 600;">New device: Pixel 7</div>
        <div style="font-size: 14px; color: #56423A;">Signed in to your account · Android</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: #FFFFFF;">
      <div style="font-size: 14px; font-weight: 600;">Check these match on Pixel 7</div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; text-align: center;">
        <sc-for list="{{sas}}" as="e" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 32px; line-height: 1;">{{e.glyph}}</span><span style="font-size: 11px; font-weight: 600; color: #56423A;">{{e.name}}</span></div>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 13px; line-height: 1.45; color: #56423A;">Allow only if you are setting up Pixel 7 yourself. It will be able to read every clip in My Devices.</div>
    <div style="display: flex; gap: 10px;">
      <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #8A7269; background: transparent; color: #A43D00; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Deny</button>
      <button style="flex: 1; height: 48px; border-radius: 24px; border: none; background: #A43D00; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Allow</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { sas: [{ glyph: '🦊', name: 'Fox' }, { glyph: '🍋', name: 'Lemon' }, { glyph: '🚀', name: 'Rocket' }, { glyph: '🎸', name: 'Guitar' }, { glyph: '🌵', name: 'Cactus' }] };
  }
}
</script>
</body>
</html>
