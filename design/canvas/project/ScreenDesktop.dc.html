<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFF8F6; color: #231A16; font-family: 'Roboto Flex', system-ui, sans-serif; display: flex;">
  <nav style="width: 88px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 20px; background: #FFF1EC;">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #FF7A1A; color: #3A1400; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="width: 56px; height: 32px; border-radius: 16px; background: #FFDBCC; color: #2C160C; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></span><span style="font-size: 12px; font-weight: 700;">Clips</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #56423A;"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h8"/><path d="M7 19h5"/><rect x="16" y="11" width="6" height="11" rx="2"/></svg></span><span style="font-size: 12px; font-weight: 550;">Devices</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #56423A;"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span><span style="font-size: 12px; font-weight: 550;">Settings</span></div>
  </nav>

  <section style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 24px; gap: 14px; border-right: 1px solid #F1DFD8;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; border: none; background: transparent; color: #231A16; font-family: inherit; font-size: 24px; font-weight: 750; font-stretch: 120%; cursor: pointer;">My Devices<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <span style="flex-grow: 1;"></span>
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: #FFDBCC; color: #3A1400; font-size: 13px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #A43D00;"></span>Live · watching clipboard</span>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #8A7269; background: transparent; color: #A43D00; font-family: inherit; font-size: 14px; font-weight: 550; display: flex; align-items: center; gap: 8px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Pause</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px; background: #FCEAE3; color: #56423A; font-size: 14px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search clips</div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; border-radius: 20px; background: #FFFFFF; overflow: hidden; box-shadow: 0 0 0 2px #FF7A1A;">
        <div style="width: 4px; background: #C23B52; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; padding: 16px 8px 8px 18px; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 18px; font-weight: 600; line-height: 1.4;">Prof's office hours moved to Wednesday 3–4 pm, cabin B-12</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: #F8DDE2; color: #5A0E1C; font-size: 12px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C23B52;"></span>Galaxy</span>
            <span style="font-size: 12px; color: #56423A; flex-grow: 1;">just now · copied to this PC</span>
            <button aria-label="Copy" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #FFDBCC; color: #3A1400; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          </div>
        </div>
      </div>
      <sc-for list="{{clips}}" as="k" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 16px; border-radius: 20px; background: {{k.bg}};">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: {{k.dot}}; flex-shrink: 0;"></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px;">
            <span style="font-family: {{k.font}}; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1;">{{k.text}}</span>
            <span style="font-size: 11px; font-weight: 550; letter-spacing: 0.04em; color: #56423A; flex-shrink: 0;">{{k.meta}}</span>
          </div>
          <button aria-label="Copy" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #56423A; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
      </sc-for>
    </div>
  </section>

  <aside style="width: 420px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; padding: 24px; box-sizing: border-box; background: #FFF1EC;">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #56423A;">DEVICES · 3 OF 4 ONLINE</div>
    <div style="align-self: center; position: relative; width: 240px; height: 240px;">
      <div style="position: absolute; left: 24px; top: 24px; width: 188px; height: 188px; border-radius: 50%; border: 2px dashed #DDC1B6; box-sizing: border-box;"></div>
      <svg width="240" height="240" viewBox="0 0 240 240" style="position: absolute; left: 0; top: 0;" fill="none" stroke-width="2" stroke-linecap="round"><path d="M120 120 L120 30" stroke="#C23B52"/><path d="M120 120 L41 165" stroke="#2E6FC4"/><path d="M120 120 L199 165" stroke="#DDC1B6" stroke-dasharray="4 6"/></svg>
      <div style="position: absolute; left: 88px; top: 88px; width: 64px; height: 64px; border-radius: 32px; background: #FF7A1A; color: #3A1400; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px #FFF1EC;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
      <div style="position: absolute; left: 98px; top: 8px; width: 44px; height: 44px; border-radius: 22px; background: #C23B52; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></div>
      <div style="position: absolute; left: 19px; top: 143px; width: 44px; height: 44px; border-radius: 22px; background: #2E6FC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"/><path d="M2 20h20"/></svg></div>
      <div style="position: absolute; left: 177px; top: 143px; width: 44px; height: 44px; border-radius: 22px; background: #FFF1EC; border: 2px solid #7E50C9; box-sizing: border-box; color: #7E50C9; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px;"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF7A1A;"></span><span style="flex-grow: 1; font-weight: 600;">Windows PC · this device</span><span style="color: #56423A; font-size: 12px;">online</span></div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px;"><span style="width: 10px; height: 10px; border-radius: 5px; background: #C23B52;"></span><span style="flex-grow: 1;">Galaxy</span><span style="color: #56423A; font-size: 12px;">online</span></div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px;"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2E6FC4;"></span><span style="flex-grow: 1;">MacBook</span><span style="color: #56423A; font-size: 12px;">online</span></div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px;"><span style="width: 10px; height: 10px; border-radius: 5px; border: 2px solid #7E50C9; box-sizing: border-box;"></span><span style="flex-grow: 1;">Lab PC (web)</span><span style="color: #56423A; font-size: 12px;">seen 2 d ago</span></div>
    </div>
    <button style="align-self: flex-start; height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #FFDBCC; color: #2C160C; font-family: inherit; font-size: 14px; font-weight: 550; cursor: pointer;">Link a new device</button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const sans = "'Roboto Flex', system-ui, sans-serif", mono = "'JetBrains Mono', monospace";
    const c = (text, meta, dot, code) => ({ text, meta, dot, font: code ? mono : sans, bg: '#F6E5DE' });
    return {
      clips: [
        c('https://pub.dev/packages/cryptography', 'THIS PC · 12 MIN', '#FF7A1A', false),
        c('Order #4471 ships Thursday via BlueDart', 'GALAXY · 40 MIN', '#C23B52', false),
        c('flutter pub add supabase_flutter', 'MACBOOK · 1 H', '#2E6FC4', true),
        c('Room 204, second floor, left of the lift', 'MACBOOK · 2 H', '#2E6FC4', false),
        c('supabase start && supabase test db', 'THIS PC · 3 H', '#FF7A1A', true),
        c('https://docs.flutter.dev/ui/adaptive-responsive', 'GALAXY · 5 H', '#C23B52', false)
      ]
    };
  }
}
</script>
</body>
</html>
