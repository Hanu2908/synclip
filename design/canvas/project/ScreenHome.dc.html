<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.on}}; font-family: 'Roboto Flex', system-ui, sans-serif;">

  <div style="display: flex; align-items: center; height: 64px; padding: 8px 8px 0 8px; box-sizing: border-box;">
    <button style="display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 10px; border: none; background: transparent; color: {{c.on}}; font-family: inherit; font-size: 22px; font-weight: 750; font-stretch: 120%; cursor: pointer;">My Devices<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <span style="flex-grow: 1;"></span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; margin-right: 8px; border-radius: 14px; background: {{c.secCont}}; color: {{c.onSecCont}}; font-size: 12px; font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{c.primary}};"></span>Live</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 18px 14px;">
    <div style="display: flex;">
      <div style="width: 26px; height: 26px; border-radius: 13px; background: #FF7A1A; border: 2px solid {{c.bg}};"></div>
      <div style="width: 26px; height: 26px; border-radius: 13px; background: #2E6FC4; border: 2px solid {{c.bg}}; margin-left: -8px;"></div>
      <div style="width: 26px; height: 26px; border-radius: 13px; background: #14826F; border: 2px solid {{c.bg}}; margin-left: -8px;"></div>
    </div>
    <span style="font-size: 13px; color: {{c.variant}};">3 of 4 devices online</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px;">
    <div style="display: flex; border-radius: 20px; background: {{c.hero}}; overflow: hidden; box-shadow: 0 0 0 1px {{c.outlineVar}};">
      <div style="width: 4px; background: #2E6FC4; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; padding: 16px 6px 8px 16px; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 18px; font-weight: 600; line-height: 1.4;">Meeting moved to 5 pm, room 204. Bring the printed draft.</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: {{c.chipBlue}}; color: {{c.onChipBlue}}; font-size: 12px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2E6FC4;"></span>MacBook</span>
          <span style="font-size: 12px; color: {{c.variant}}; flex-grow: 1;">just now</span>
          <button aria-label="Copy" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: {{c.secCont}}; color: {{c.onSecCont}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
      </div>
    </div>

    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: {{c.variant}}; padding: 10px 4px 2px;">EARLIER TODAY</div>

    <sc-for list="{{clips}}" as="k" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 16px; border-radius: 20px; background: {{c.card}};">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{k.dot}}; flex-shrink: 0;"></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-family: {{k.font}}; font-size: {{k.size}}; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{k.text}}</div>
          <div style="font-size: 11px; font-weight: 550; letter-spacing: 0.04em; color: {{c.variant}};">{{k.meta}}</div>
        </div>
        <button aria-label="Copy" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: transparent; color: {{c.variant}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </sc-for>
  </div>

  <button style="position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; border: none; background: #FF7A1A; color: {{c.onPriCont}}; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 10px #00000033; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 17v-6M9 14l3-3 3 3"/></svg>Send clipboard</button>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: {{c.nav}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="width: 64px; height: 32px; border-radius: 16px; background: {{c.secCont}}; color: {{c.onSecCont}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></span><span style="font-size: 12px; font-weight: 700;">Clips</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.variant}};"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h8"/><path d="M7 19h5"/><rect x="16" y="11" width="6" height="11" rx="2"/></svg></span><span style="font-size: 12px; font-weight: 550;">Devices</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.variant}};"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span><span style="font-size: 12px; font-weight: 550;">Settings</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const light = {
      bg: '#FFF8F6', on: '#231A16', variant: '#56423A', outlineVar: '#DDC1B6',
      hero: '#FFFFFF', card: '#F6E5DE', nav: '#FCEAE3',
      primary: '#A43D00', secCont: '#FFDBCC', onSecCont: '#2C160C', onPriCont: '#3A1400',
      chipBlue: '#E3ECFA', onChipBlue: '#123A73'
    };
    const night = {
      bg: '#1A120E', on: '#F1DFD8', variant: '#DDC1B6', outlineVar: '#56423A',
      hero: '#322824', card: '#271E1A', nav: '#231A16',
      primary: '#FFB693', secCont: '#5D4033', onSecCont: '#FFDBCC', onPriCont: '#2E0E00',
      chipBlue: '#1E3A66', onChipBlue: '#D6E3FF'
    };
    const sans = "'Roboto Flex', system-ui, sans-serif";
    const mono = "'JetBrains Mono', monospace";
    const clip = (text, meta, dot, code) => ({ text, meta, dot, font: code ? mono : sans, size: code ? '13px' : '15px' });
    return {
      c: dark ? night : light,
      clips: [
        clip('https://pub.dev/packages/cryptography', 'THIS PHONE · 12 MIN', '#FF7A1A', false),
        clip('Order #4471 ships Thursday via BlueDart', 'WINDOWS PC · 40 MIN', '#14826F', false),
        clip('flutter pub add supabase_flutter', 'MACBOOK · 1 H · CODE', '#2E6FC4', true),
        clip('Room 204, second floor, left of the lift', 'MACBOOK · 2 H', '#2E6FC4', false),
        clip('supabase start && supabase test db', 'WINDOWS PC · 3 H · CODE', '#14826F', true)
      ]
    };
  }
}
</script>
</body>
</html>
