reviews:
  profile: "assertive"
  request_changes_workflow: true
  poem: false
  path_filters:
    - "!design/canvas/**"
  path_instructions:
    - path: "lib/core/crypto/**"
      instructions: |
        Security-critical. Check against PLAN.md §4.1: AES-256-GCM with a fresh random 96-bit nonce per message,
        AAD binding v|room_id|clip_id|sender_device_id|epoch, X25519 + HKDF-SHA256 key wrapping, Random.secure only.
        Flag key or plaintext material that is logged, persisted, or kept longer than needed. Every path needs tests.
    - path: "lib/core/security/**"
      instructions: |
        Security-critical. Sensitive-clip detection and the link-preview URL guard (https only, block private,
        loopback and link-local addresses, 5 s timeout, 512 KB cap). Flag missing deny-case tests.
    - path: "supabase/migrations/**"
      instructions: |
        Every table must enable RLS. SECURITY DEFINER functions must set search_path and re-check membership.
        Clients must never update membership status directly. Each policy or RPC needs allow and deny pgTAP tests.
    - path: "supabase/functions/**"
      instructions: |
        Edge Functions: validate input, enforce the rate limits in PLAN.md §1.3, never return or log secrets,
        use the service-role key only server-side.
    - path: "lib/**/domain/**"
      instructions: |
        Pure Dart: no imports from flutter, supabase_flutter or platform plugins (AGENTS.md layer rules).
    - path: "lib/**"
      instructions: |
        Follow AGENTS.md: colors from ColorScheme roles or app/theme/tokens.dart only, 48 dp touch targets,
        semantics on icon-only controls, animations honour MediaQuery.disableAnimations, and no duplicated limits.
    - path: "**/*.md"
      instructions: |
        Docs must match the code in this PR. Flag drift between PLAN.md, PRODUCT.md, AGENTS.md and the implementation.
